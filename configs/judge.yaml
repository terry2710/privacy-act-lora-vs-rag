prompt_version: judge-v1

roles:
  primary: gpt
  secondary: claude

judges:
  gpt:
    provider: openai
    model: gpt-5.4-mini-2026-03-17
    reasoning_effort: low
    max_output_tokens: 2000
  claude:
    provider: anthropic
    model: claude-opus-5-5
    effort: low
    max_tokens: 2000

sets: [s_mem, s_para, h1, h2, s_neg]
arms: [A0, A1, A2, A3]

run:
  max_workers: 4
  max_retries: 5
  seed: 20261005

calibration:
  arms: [A0, A1, A2]
  per_set:
    s_mem: 8
    s_para: 14
    h1: 12
    h2: 8
    s_neg: 8
  min_kappa: 0.6
  min_raw_if_degenerate: 0.9

paths:
  answers_dir: results/phase3/answers
  eval_dir: data/qa/eval
  evidence:
    - data/qa/final/train.jsonl
    - data/qa/verified/h1_questions.jsonl
    - data/qa/verified/h2_questions.jsonl
  cache_dir: results/phase3/judge_cache
  calibration_dir: results/phase3/calibration
  judgements_dir: results/phase3/judgements
