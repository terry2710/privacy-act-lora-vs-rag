corpus:
  sections: data/processed/sections.jsonl
chunking:
  max_chars: 1200
  overlap_chars: 200
dense:
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
bm25:
  k1: 1.5
  b: 0.75
hybrid:
  rrf_k: 60
  candidates: 50
index_dir: indexes/rag
selection:
  dev: data/qa/eval/dev_para.jsonl
  methods: [bm25, dense, hybrid]
  ks: [1, 3, 5, 8, 10]
  primary_k: 5
  tolerance: 0.02
  out: results/phase3/retrieval_dev.json
