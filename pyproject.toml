[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-bench"
version = "0.1.0"
description = "Controlled comparison of LoRA fine-tuning and RAG on the Australian Privacy Act 1988"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = ["torch>=2.3", "transformers>=4.45", "peft>=0.13", "safetensors", "sentencepiece"]
dev = ["pytest>=8.0"]
train = ["torch>=2.3", "transformers>=4.45", "peft>=0.13", "wandb>=0.19"]
rag = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
registry = ["mlflow>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
