[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-bench"
version = "0.1.0"
description = "Controlled comparison of LoRA fine-tuning and RAG on the Australian Privacy Act 1988"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
